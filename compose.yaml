services:
  postgres:
    image: postgres:16-alpine
    container_name: royale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: royale
      POSTGRES_PASSWORD: royale
      POSTGRES_DB: royale
    ports:
      - "5433:5432"
    volumes:
      - royale_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U royale -d royale"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  royale_pgdata:
